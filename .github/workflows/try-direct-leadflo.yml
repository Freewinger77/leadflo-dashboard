name: Emergency clear Leadflo proxy (test direct)

# Temporary: proxy at 87.86.24.159:5810 returns 407. Try direct Leadflo
# from App Service; restore proxy if WAF blocks.

on:
  push:
    branches: [main]
    paths:
      - "CLEAR_PROXY_TRY_DIRECT"

permissions:
  id-token: write
  contents: read

concurrency:
  group: restart-poller-production
  cancel-in-progress: true

env:
  AZURE_CLIENT_ID: 4e59105d-0bf3-4ca0-a3ba-3158480da603
  AZURE_TENANT_ID: d2190b52-443e-4ff1-9c5e-088aecce41f9
  AZURE_SUBSCRIPTION_ID: 84e85ed8-74a4-461a-a958-6aaeeb95f2cc
  AZURE_WEBAPP_NAME: dental-asthetica
  AZURE_RESOURCE_GROUP: rapidspec-rg

jobs:
  try-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot proxy, clear it, restart, test
        run: |
          set -euo pipefail
          az webapp config appsettings list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --output json > /tmp/settings.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          settings = {s["name"]: s.get("value") or "" for s in json.load(open("/tmp/settings.json"))}
          proxy = settings.get("LEADFLO_HTTP_PROXY") or ""
          Path("/tmp/proxy.url").write_text(proxy)
          if proxy:
              u = urlparse(proxy)
              print(f"saved proxy {u.scheme}://{u.hostname}:{u.port or 80}/… (len={len(proxy)})")
          else:
              print("no proxy set already")
          PY

          # Clear proxy so App Service calls Leadflo directly.
          az webapp config appsettings delete \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --setting-names LEADFLO_HTTP_PROXY \
            --output none
          az webapp restart \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --output none
          sleep 35

          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 \
              https://dental-asthetica.azurewebsites.net/api/health || true)
            echo "health $i -> $code"
            [ "$code" = "200" ] && break
            sleep 10
          done

          for i in 1 2 3 4 5 6; do
            curl -sS --max-time 60 -o /tmp/status.json \
              https://dental-asthetica.azurewebsites.net/api/status || true
            if python3 -c 'import json,sys; d=json.load(open("/tmp/status.json")); print(d.get("leadflo")); sys.exit(0 if (d.get("leadflo") or {}).get("ok") else 1)'; then
              ok=1
              break
            fi
            sleep 12
          done

          if [ "$ok" = "1" ]; then
            echo "Direct Leadflo OK — leaving proxy cleared"
            curl -sS --max-time 90 -X POST https://dental-asthetica.azurewebsites.net/api/poll || true
            curl -sS --max-time 40 https://dental-asthetica.azurewebsites.net/api/status | python3 -c 'import sys,json;d=json.load(sys.stdin);print("latestPoll",d.get("latestPoll"))'
            exit 0
          fi

          echo "Direct failed — restoring proxy"
          PROXY=$(cat /tmp/proxy.url)
          if [ -n "$PROXY" ]; then
            az webapp config appsettings set \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_WEBAPP_NAME}" \
              --settings "LEADFLO_HTTP_PROXY=${PROXY}" \
              --output none
            az webapp restart \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_WEBAPP_NAME}" \
              --output none
          fi
          exit 1
