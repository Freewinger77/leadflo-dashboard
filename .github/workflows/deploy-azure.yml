name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure-production
  cancel-in-progress: false

# Azure Entra app: leadflo-github-deploy
# Federated subject must match GitHub's claim (includes numeric IDs):
#   repo:Freewinger77@135714302/leadflo-dashboard@1326708531:ref:refs/heads/main
env:
  AZURE_CLIENT_ID: 4e59105d-0bf3-4ca0-a3ba-3158480da603
  AZURE_TENANT_ID: d2190b52-443e-4ff1-9c5e-088aecce41f9
  AZURE_SUBSCRIPTION_ID: 84e85ed8-74a4-461a-a958-6aaeeb95f2cc
  AZURE_WEBAPP_NAME: dental-asthetica
  AZURE_RESOURCE_GROUP: rapidspec-rg
  NODE_VERSION: "22"

jobs:
  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Zip deploy to Azure App Service
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package app (Oryx installs deps on Azure)
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          rsync -a \
            --exclude node_modules \
            --exclude .git \
            --exclude .github \
            --exclude data \
            --exclude '*.db' \
            --exclude '*.db-journal' \
            --exclude .env \
            --exclude .azure \
            --exclude coverage \
            --exclude dist \
            ./ "$STAGE/"
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/leadflo-deploy.zip" .)
          ls -lh leadflo-deploy.zip

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to dental-asthetica
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: leadflo-deploy.zip

      # Production is live for all Implant leads (notes + outbound allowlist off).
      # App settings win over code defaults — keep these explicit on every deploy.
      - name: Go-live app settings (ungate Implant notes + outbound)
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --settings \
              NOTES_ONLY_TEST_NAMES=false \
              OUTBOUND_ALLOWLIST_ONLY=false \
              TRACKED_TREATMENT_TYPES=Implant,Ortho \
            --output none
          az webapp restart \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --output none

      - name: Smoke check
        run: |
          set -euo pipefail
          for url in \
            "https://dental-asthetica.azurewebsites.net/api/health" \
            "https://dental-asthetica.wasup.co/api/health"
          do
            echo "GET $url"
            for i in 1 2 3 4 5 6; do
              code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$url" || true)
              echo "  attempt $i -> HTTP $code"
              if [ "$code" = "200" ]; then
                cat /tmp/health.json
                echo
                break
              fi
              sleep 10
            done
            test "$code" = "200"
          done
          python3 - <<'PY'
          import json
          health = json.load(open("/tmp/health.json"))
          tracked = [t.lower() for t in health.get("trackedTypes") or []]
          print("trackedTypes:", tracked)
          for need in ("implant", "ortho"):
              if need not in tracked:
                  raise SystemExit(f"missing tracked type: {need}")
          print("tracked types ok")
          PY

          # Preview WF-1 candidates (no claim) — confirm Ortho/Implant appear.
          az webapp config appsettings list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --output json > /tmp/settings.json
          WF1_KEY=$(python3 - <<'PY'
          import json
          settings = {s["name"]: s.get("value") or "" for s in json.load(open("/tmp/settings.json"))}
          key = settings.get("WF1_API_KEY") or ""
          if not key:
              raise SystemExit("WF1_API_KEY missing from app settings")
          print(key)
          PY
          )
          curl -sS --max-time 60 \
            -H "X-WF1-Key: ${WF1_KEY}" \
            "https://dental-asthetica.wasup.co/api/wf1/candidates?limit=50" \
            > /tmp/candidates.json
          python3 - <<'PY'
          import json
          from collections import Counter
          data = json.load(open("/tmp/candidates.json"))
          filters = (data.get("filters") or {}).get("trackedTreatmentTypes") or []
          print("candidate filters.trackedTreatmentTypes:", filters)
          selected = data.get("selected") or []
          skipped = data.get("skipped") or []
          print("selected:", len(selected), "skipped sample:", len(skipped), "scanned:", data.get("scanned"))
          types = Counter((c.get("treatmentType") or "?") for c in selected)
          print("selected treatment types:", dict(types))
          # Ortho may not be selected yet if none are in contact stages — still
          # show skipped reasons that mention Ortho/Invisalign for visibility.
          interest = [
              s for s in skipped
              if "ortho" in (s.get("reason") or "").lower()
              or "invisalign" in (s.get("reason") or "").lower()
              or "ortho" in (s.get("fullName") or "").lower()
          ]
          ortho_rows = [
              s for s in skipped + selected
              if str((s.get("treatmentType") if "treatmentType" in s else "") or "").lower() == "ortho"
          ]
          # selected have treatmentType; skipped may not — count from selected + reason strings
          skipped_ortho = sum(
              1 for s in skipped
              if 'treatment "Ortho"' in (s.get("reason") or "")
              or 'treatment "ortho"' in (s.get("reason") or "").lower()
          )
          # Also count leads whose treatment is Ortho among selected
          selected_ortho = types.get("Ortho", 0) + types.get("ortho", 0)
          selected_invis = types.get("Invisalign", 0) + types.get("invisalign", 0)
          print(f"selected Ortho={selected_ortho} Invisalign={selected_invis}")
          print("skippedByReason:", json.dumps(data.get("skippedByReason") or {}, indent=2)[:2000])
          if "ortho" not in [t.lower() for t in filters]:
              raise SystemExit("WF-1 candidates filter missing ortho")
          print("wf1 candidates preview ok")
          PY
